[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parent-progress-sync"
version = "1.0.0"
description = "Sync Linear parent-issue titles with their completed-subissue percentage"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
parent-progress-sync = "parent_progress_sync.cli:main"

[tool.setuptools]
packages = ["parent_progress_sync"]
